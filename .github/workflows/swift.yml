name: "Camera Button CI"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  iOS:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build library
        run: xcodebuild build -scheme CameraButton -destination 'generic/platform=iOS Simulator'
      - name: Build example
        run: xcodebuild build -project CameraButton.xcodeproj -scheme CameraButton-Example -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
